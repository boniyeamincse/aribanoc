# ntopng Configuration for Ariba NOC Center
# Reference: https://www.ntop.org/guides/ntopng/

# Web interface port
-w=3000

# Data directory
-d=/var/lib/ntopng

# Network interface(s) to monitor — change to your actual interface
# For Docker, typically eth0; for host-mode use the real interface name
-i=eth0

# Enable community ID (aligns with Suricata)
# --community-id

# Redis connection (ntopng uses Redis for state)
-r=redis:6379

# Log level: 0=error, 1=warning, 2=normal, 3=info, 4=debug
--loglevel=2

# Disable autologout in web UI (optional for NOC dashboards)
--disable-autologout

# HTTP prefix (useful behind a reverse proxy)
# --http-prefix=/ntopng

# SNMP community (for device polling)
# --snmp-agent-port=16100

# Maximum number of local hosts to track
--max-num-hosts=131072

# Maximum number of flows to track
--max-num-flows=131072

# Flow aggregation interval (seconds)
--flow-aggregation-interval=60

# Export flows via JSON to syslog (optional — for ELK integration)
# --online-license-server-check
