global:
  resolve_timeout: 5m
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_smarthost: '${ALERT_SMTP_HOST}:${ALERT_SMTP_PORT:-587}'
  smtp_auth_username: '${ALERT_SMTP_USER}'
  smtp_auth_password: '${ALERT_SMTP_PASS}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h

receivers:
  - name: 'default'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID:-0}
        message: |
          🔔 *NOC Alert*
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        parse_mode: 'Markdown'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] NOC Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h2>🚨 Critical NOC Alert</h2>
          <b>Alert:</b> {{ .GroupLabels.alertname }}<br>
          {{ range .Alerts }}
          <b>Instance:</b> {{ .Labels.instance }}<br>
          <b>Summary:</b> {{ .Annotations.summary }}<br>
          <b>Description:</b> {{ .Annotations.description }}<br>
          <hr>
          {{ end }}
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID:-0}
        message: |
          🚨 *CRITICAL NOC Alert*
          *Alert:* {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
        parse_mode: 'Markdown'
        send_resolved: true

  - name: 'warning-alerts'
    telegram_configs:
      - bot_token: '${ALERT_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERT_TELEGRAM_CHAT_ID:-0}
        message: |
          ⚠️ *Warning NOC Alert*
          *Alert:* {{ .GroupLabels.alertname }}
          {{ range .Alerts }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}
        parse_mode: 'Markdown'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
