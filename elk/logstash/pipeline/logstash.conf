input {
  # Filebeat ships Suricata eve.json and system logs
  beats {
    port => 5044
    ssl_enabled => false
  }

  # Optional: receive UDP syslog from network devices
  udp {
    port => 5140
    codec => plain
    type => "syslog"
  }

  # Optional: ntopng can export JSON flows via HTTP or file
  # tcp {
  #   port => 5141
  #   codec => json_lines
  #   type => "ntopng"
  # }
}

filter {
  # ── Suricata EVE JSON ──────────────────────────────────────────────────────
  if [type] == "suricata" or [log][file][path] =~ "suricata" {
    json {
      source => "message"
      target => "suricata"
    }
    if [suricata][event_type] {
      mutate {
        add_field => { "[@metadata][index_suffix]" => "suricata" }
        add_tag    => ["suricata"]
        rename     => { "[suricata][src_ip]"  "src_ip" }
        rename     => { "[suricata][dest_ip]" "dest_ip" }
        rename     => { "[suricata][proto]"   "protocol" }
      }
    }
    # Parse suricata timestamp
    if [suricata][timestamp] {
      date {
        match => ["[suricata][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }
    # Add GeoIP for source IP
    if [src_ip] and [src_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)" {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }
  }

  # ── Syslog (network devices, system logs) ─────────────────────────────────
  else if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
      add_field => { "[@metadata][index_suffix]" => "syslog" }
      add_tag => ["syslog"]
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }
    mutate {
      remove_field => ["message"]
      rename => { "syslog_message" => "message" }
    }
  }

  # ── System logs via filebeat ───────────────────────────────────────────────
  else if [event][dataset] == "system.syslog" or [event][dataset] == "system.auth" {
    mutate {
      add_field => { "[@metadata][index_suffix]" => "system" }
      add_tag   => ["system-logs"]
    }
  }

  # ── Zabbix server log ─────────────────────────────────────────────────────
  else if [log][file][path] =~ "zabbix" {
    grok {
      match => { "message" => "%{YEAR}%{MONTHNUM}%{MONTHDAY}:%{HOUR}%{MINUTE}%{SECOND}\\s+%{NUMBER:zbx_pid}\\s+%{WORD:zbx_level}\\s+%{GREEDYDATA:zbx_message}" }
      add_field => { "[@metadata][index_suffix]" => "zabbix" }
      add_tag   => ["zabbix"]
    }
  }

  # ── Default: NOC generic index ────────────────────────────────────────────
  else {
    mutate {
      add_field => { "[@metadata][index_suffix]" => "generic" }
    }
  }

  # Strip noisy fields
  mutate {
    remove_field => ["host", "agent", "ecs"]
  }
}

output {
  elasticsearch {
    hosts          => ["http://elasticsearch:9200"]
    user           => "elastic"
    password       => "${ELASTIC_PASSWORD}"
    index          => "noc-%{[@metadata][index_suffix]}-%{+YYYY.MM.dd}"
    action         => "create"
    ssl_enabled    => false
  }
  # Uncomment to debug in container logs:
  # stdout { codec => rubydebug }
}

