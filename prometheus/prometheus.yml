global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ariba-noc-center'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'noc-host'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Add additional node exporters for monitored hosts:
