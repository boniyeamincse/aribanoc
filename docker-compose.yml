name: ariba-noc-center

services:
  # --------------------
  # Observability / Metrics
  # --------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9090:9090'
    depends_on:
      - node_exporter
      - alertmanager
    networks:
      - noc

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^(sys|proc|dev|host|run)'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9100:9100'
    networks:
      - noc

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-grafana_admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000/}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3000:3000'
    depends_on:
      - prometheus
    networks:
      - noc

  # --------------------
  # Zabbix (Monitoring)
  # --------------------
  zabbix-db:
    image: mariadb:11.4
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DATABASE: ${ZABBIX_DB_NAME:-zabbix}
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env}
    volumes:
      - zabbix_db:/var/lib/mysql
    networks:
      - noc

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env}
      ZBX_STARTPOLLERS: 15
      ZBX_STARTPOLLERSUNREACHABLE: 5
      ZBX_STARTTRAPPERS: 10
      PHP_TZ: ${TZ:-UTC}
    volumes:
      - ./zabbix/alertscripts:/usr/lib/zabbix/alertscripts:ro
      - ./zabbix/externalscripts:/usr/lib/zabbix/externalscripts:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:10051:10051'
    depends_on:
      - zabbix-db
    networks:
      - noc

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZABBIX_SERVER_NAME:-zabbix-agent}
      ZBX_SERVER_PORT: 10051
    volumes:
      - /var/run:/var/run:rw
      - /sys:/sys:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:10050:10050'
    depends_on:
      - zabbix-server
    networks:
      - noc

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: ${ZABBIX_DB_NAME:-zabbix}
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      PHP_TZ: ${TZ:-UTC}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8090:8080'
    depends_on:
      - zabbix-server
    networks:
      - noc

  # --------------------
  # Network Traffic / IDS
  # --------------------
  ntopng:
    image: ntop/ntopng:stable
    container_name: ntopng
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Configure via /etc/ntopng/ntopng.conf (not included fully in this scaffold)
      # NTOPNG_USER: admin
      # NTOPNG_PASSWORD: admin
    volumes:
      - ntopng_data:/var/lib/ntopng
      - ./ntopng/ntopng.conf:/etc/ntopng/ntopng.conf:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:3001:3000'   # web UI (mapped)
      - '${BIND_ADDRESS:-127.0.0.1}:3002:3001'   # streaming
      - '2055:2055/udp'
    networks:
      - noc

  suricata:
    image: oisf/suricata:7.0.6
    container_name: suricata
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./suricata/etc:/etc/suricata:ro
      - ./suricata/var-lib:/var/lib/suricata
      - ./suricata/log:/var/log/suricata
    # NOTE: Suricata needs privileged access to capture traffic.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    networks:
      - noc

  # --------------------
  # Centralized Logging (ELK)
  # --------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      discovery.type: single-node
      xpack.security.enabled: 'true'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      xpack.security.http.ssl.enabled: 'false'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9200:9200'
    networks:
      - noc
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  logstash:
    image: docker.elastic.co/logstash/logstash:8.16.1
    container_name: logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      TZ: ${TZ:-UTC}
      ELASTIC_USER: elastic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:5044:5044'
      - '${BIND_ADDRESS:-127.0.0.1}:9600:9600'
    networks:
      - noc

  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.1
    container_name: kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      TZ: ${TZ:-UTC}
      ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:5601:5601'
    networks:
      - noc

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.16.1
    container_name: filebeat
    restart: unless-stopped
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./suricata/log:/var/log/suricata:ro
      - /var/log:/var/log/host:ro
    networks:
      - noc

  # --------------------
  # Inventory & Documentation
  # --------------------
  librenms-db:
    image: mariadb:11.4
    container_name: librenms-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DATABASE: ${LIBRENMS_DB_NAME:-librenms}
      MYSQL_USER: ${LIBRENMS_DB_USER:-librenms}
      MYSQL_PASSWORD: ${LIBRENMS_DB_PASSWORD:?set LIBRENMS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${LIBRENMS_DB_PASSWORD:?set LIBRENMS_DB_PASSWORD in .env}
    volumes:
      - librenms_db:/var/lib/mysql
    networks:
      - noc

  librenms:
    image: librenms/librenms:latest
    container_name: librenms
    restart: unless-stopped
    hostname: librenms
    depends_on:
      - librenms-db
      - redis
    environment:
      TZ: ${TZ:-UTC}
      DB_HOST: librenms-db
      DB_NAME: ${LIBRENMS_DB_NAME:-librenms}
      DB_USER: ${LIBRENMS_DB_USER:-librenms}
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD:?set LIBRENMS_DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 2
      # Auto-discovery via SNMP
      LIBRENMS_SNMP_COMMUNITY: ${LIBRENMS_SNMP_COMMUNITY:-public}
      LIBRENMS_AUTODISCOVERY_ENABLED: 'true'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8000:8000'
    volumes:
      - librenms_data:/config
      - ./librenms/rrd:/var/lib/rrd:rw
    networks:
      - noc

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - noc

  netbox-db:
    image: postgres:16
    container_name: netbox-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${NETBOX_DB_NAME:-netbox}
      POSTGRES_USER: ${NETBOX_DB_USER:-netbox}
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD:?set NETBOX_DB_PASSWORD in .env}
    volumes:
      - netbox_db:/var/lib/postgresql/data
    networks:
      - noc

  netbox:
    image: netboxcommunity/netbox:v3.7.1
    container_name: netbox
    restart: unless-stopped
    depends_on:
      - netbox-db
      - redis
    environment:
      TZ: ${TZ:-UTC}
      DB_HOST: netbox-db
      DB_NAME: ${NETBOX_DB_NAME:-netbox}
      DB_USER: ${NETBOX_DB_USER:-netbox}
      DB_PASSWORD: ${NETBOX_DB_PASSWORD:?set NETBOX_DB_PASSWORD in .env}
      NETBOX_SECRET_KEY: ${NETBOX_SECRET_KEY:?set NETBOX_SECRET_KEY in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_CACHE_DATABASE: 1
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:8080:8080'
    volumes:
      - netbox_data:/opt/netbox/media
      - ./netbox/config:/etc/netbox/config:ro
    networks:
      - noc

  # --------------------
  # Alerts & Notifications (Prometheus Alertmanager)
  # --------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:9093:9093'
    networks:
      - noc

  # --------------------
  # Optional security (placeholders)
  # --------------------
  # wazuh:
  #   image: wazuh/wazuh:latest
  #   ...
  # fail2ban:
  #   image: crazymax/fail2ban
  #   ...

  # --------------------
  # Self-healing / health monitoring (script)
  # --------------------
  watchdog:
    image: alpine:3.20
    container_name: noc-watchdog
    restart: unless-stopped
    profiles: ["ops"]
    environment:
      TZ: ${TZ:-UTC}
      TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh","-c"]
    command: ["apk add --no-cache docker-cli curl && /scripts/watchdog.sh"]
    networks:
      - noc
    depends_on:
      - prometheus

networks:
  noc:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  zabbix_db:
  es_data:
  librenms_data:
  librenms_db:
  netbox_db:
  netbox_data:
  ntopng_data:
  redis_data:
  alertmanager_data:

